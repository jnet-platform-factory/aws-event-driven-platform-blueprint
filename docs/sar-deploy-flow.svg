<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="sar" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#C8511B"/><stop offset="1" stop-color="#FF9900"/>
    </linearGradient>
    <linearGradient id="cfn" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B0084D"/><stop offset="1" stop-color="#FF4F8B"/>
    </linearGradient>
    <linearGradient id="evb" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B0084D"/><stop offset="1" stop-color="#FF4F8B"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#232F3E"/>
    </marker>
    <marker id="headgrey" viewBox="0 0 12 12" refX="11" refY="6" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#7D8998"/>
    </marker>
    <!-- GitHub mark -->
    <g id="octo">
      <circle r="62" fill="#fff" stroke="#24292F" stroke-width="9"/>
      <path transform="translate(-40,-39) scale(5)" fill="#24292F" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
    </g>
    <!-- template (SAM) icon -->
    <g id="tmpl">
      <rect x="-62" y="-80" width="124" height="160" rx="4" fill="#fff" stroke="#BC1356" stroke-width="7"/>
      <rect x="-40" y="-55" width="22" height="22" fill="none" stroke="#BC1356" stroke-width="6"/>
      <line x1="-8" y1="-44" x2="42" y2="-44" stroke="#BC1356" stroke-width="6"/>
      <rect x="-40" y="-11" width="22" height="22" fill="none" stroke="#BC1356" stroke-width="6"/>
      <line x1="-8" y1="0" x2="42" y2="0" stroke="#BC1356" stroke-width="6"/>
      <rect x="-40" y="33" width="22" height="22" fill="none" stroke="#BC1356" stroke-width="6"/>
      <line x1="-8" y1="44" x2="42" y2="44" stroke="#BC1356" stroke-width="6"/>
    </g>
    <!-- green resource cube -->
    <g id="cube">
      <path d="M0,-46 L40,-23 L0,0 L-40,-23 z" fill="#8CC04F"/>
      <path d="M-40,-23 L0,0 L0,46 L-40,23 z" fill="#7AA116"/>
      <path d="M40,-23 L0,0 L0,46 L40,23 z" fill="#5F8A12"/>
      <path d="M0,-46 L40,-23 L40,23 L0,46 L-40,23 L-40,-23 z M-40,-23 L0,0 L40,-23 M0,0 L0,46" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1800" height="1060" fill="#ffffff"/>

  <!-- title -->
  <text x="60" y="58" font-size="30" font-weight="700" fill="#232F3E">Publish once to SAR, deploy per tenant</text>
  <text x="60" y="88" font-size="17" fill="#545B64">aws-eventbridge-firehose-opensearch-forwarder · the public repo releases and publishes itself · every tenant deploys a pinned version into its own AWS account</text>

  <!-- ========================= LANE 1: PUBLISH ========================= -->
  <rect x="40" y="110" width="1720" height="400" rx="14" fill="#F7F9FB" stroke="#D5DBDB" stroke-width="2"/>
  <rect x="40" y="110" width="440" height="40" rx="14" fill="#232F3E"/>
  <rect x="40" y="132" width="440" height="18" fill="#232F3E"/>
  <text x="60" y="137" font-size="17" font-weight="700" fill="#fff">1  RELEASE &amp; PUBLISH · from the public repo</text>

  <!-- public source -->
  <use href="#octo" x="190" y="290"/>
  <text x="190" y="390" font-size="14" font-weight="700" fill="#232F3E" text-anchor="middle">aws-eventbridge-firehose-</text><text x="190" y="408" font-size="14" font-weight="700" fill="#232F3E" text-anchor="middle">opensearch-forwarder</text>
  <text x="190" y="424" font-size="13" fill="#545B64" text-anchor="middle">jnet-platform-factory</text>
  <rect x="130" y="432" width="120" height="24" rx="12" fill="#1D8102"/>
  <text x="190" y="449" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">PUBLIC repo</text>

  <!-- arrow source -> publisher -->
  <path d="M265,290 L455,290" stroke="#232F3E" stroke-width="4" fill="none" marker-end="url(#head)"/>
  <text x="360" y="275" font-size="15" font-weight="700" fill="#232F3E" text-anchor="middle">Create Release</text>
  <text x="360" y="315" font-size="13" fill="#545B64" text-anchor="middle">patch · minor · major</text>

  <!-- private publisher -->
  <use href="#tmpl" x="560" y="280"/>
  <text x="560" y="390" font-size="18" font-weight="700" fill="#232F3E" text-anchor="middle">Release tag vX.Y.Z</text>
  <text x="560" y="413" font-size="15" fill="#545B64" text-anchor="middle">= SemanticVersion in template.yaml</text>
  <rect x="470" y="425" width="180" height="24" rx="12" fill="#1D8102"/>
  <text x="560" y="442" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Publish to SAR · tags only</text>
  <text x="560" y="478" font-size="14" fill="#545B64" text-anchor="middle">gate (tests · lint · leak) → build → package · OIDC role</text>

  <!-- arrow publisher -> SAR -->
  <path d="M640,280 L840,280" stroke="#232F3E" stroke-width="4" fill="none" marker-end="url(#head)"/>
  <text x="740" y="265" font-size="15" font-weight="700" fill="#232F3E" text-anchor="middle">sam publish</text>
  <text x="740" y="305" font-size="13" fill="#545B64" text-anchor="middle">per region</text>

  <!-- SAR tile -->
  <rect x="850" y="180" width="200" height="200" rx="6" fill="url(#sar)"/>
  <g transform="translate(950,280)" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <path d="M-62,22 a30,30 0 0 1 8,-56 a38,38 0 0 1 72,-14 a32,32 0 0 1 46,40 a24,24 0 0 1 -6,46 z"/>
    <path d="M-30,22 l0,-26 h14 a9,9 0 1 1 16,0 h18 v26"/>
    <path d="M-62,40 h124"/>
  </g>
  <text x="950" y="410" font-size="18" font-weight="700" fill="#232F3E" text-anchor="middle">Serverless Application</text>
  <text x="950" y="432" font-size="18" font-weight="700" fill="#232F3E" text-anchor="middle">Repository (SAR)</text>
  <text x="950" y="456" font-size="13" fill="#545B64" text-anchor="middle">AWS-EventBridge-Firehose-OpenSearch-Forwarder</text>
  <text x="950" y="476" font-size="14" fill="#545B64" text-anchor="middle">Shared Services account</text>

  <!-- versions + regions + policy -->
  <g font-size="15" fill="#232F3E">
    <rect x="1110" y="175" width="300" height="200" rx="10" fill="#fff" stroke="#FF9900" stroke-width="2.5"/>
    <text x="1130" y="203" font-weight="700">Versions (immutable) · new app</text>
    <rect x="1130" y="217" width="64" height="30" rx="6" fill="#FFF2E0" stroke="#FF9900"/><text x="1162" y="238" text-anchor="middle" font-weight="700">1.6.0</text>
    <rect x="1202" y="217" width="64" height="30" rx="6" fill="#FFF2E0" stroke="#FF9900"/><text x="1234" y="238" text-anchor="middle">1.6.1</text>
    <rect x="1274" y="217" width="40" height="30" rx="6" fill="#FFF2E0" stroke="#FF9900"/><text x="1294" y="238" text-anchor="middle">…</text>
    <rect x="1322" y="217" width="64" height="30" rx="6" fill="#FFF2E0" stroke="#FF9900"/><text x="1354" y="238" text-anchor="middle">next</text>
    <text x="1130" y="280" font-weight="700">Regional copies</text>
    <text x="1130" y="304">us-east-1  ·  us-west-1</text>
    <text x="1130" y="337" font-weight="700">Resource policy, per region</text>
    <text x="1130" y="360">which tenant accounts may deploy</text>
  </g>
  <text x="1440" y="215" font-size="14" fill="#545B64">a version</text><text x="1440" y="235" font-size="13" fill="#545B64">once published</text><text x="1440" y="252" font-size="13" fill="#545B64">is immutable:</text><text x="1440" y="269" font-size="13" fill="#545B64">fix forward</text><text x="1440" y="300" font-size="14" fill="#545B64">can't be edited</text>
  <text x="1440" y="318" font-size="14" fill="#545B64">or withdrawn,</text>
  <text x="1440" y="336" font-size="14" fill="#545B64">so the gate</text>
  <text x="1440" y="354" font-size="14" fill="#545B64">runs first</text>

  <!-- ========================= LANE 2: DEPLOY ========================= -->
  <rect x="40" y="540" width="1720" height="490" rx="14" fill="#F7F9FB" stroke="#D5DBDB" stroke-width="2"/>
  <rect x="40" y="540" width="420" height="40" rx="14" fill="#232F3E"/>
  <rect x="40" y="562" width="420" height="18" fill="#232F3E"/>
  <text x="60" y="567" font-size="17" font-weight="700" fill="#fff">2  DEPLOY · per tenant, into its own account</text>

  <!-- SAR feeds lane 2 -->
  <path d="M890,492 L640,668" stroke="#7D8998" stroke-width="4" stroke-dasharray="10 8" fill="none" marker-end="url(#headgrey)"/>
  <text x="780" y="600" font-size="14" fill="#545B64">SAR mints the chosen</text>
  <text x="780" y="619" font-size="14" fill="#545B64">version's template</text>

  <!-- tenant platform repo -->
  <use href="#octo" x="190" y="760"/>
  <text x="190" y="860" font-size="18" font-weight="700" fill="#232F3E" text-anchor="middle">tenant platform repo</text>
  <text x="190" y="883" font-size="14" fill="#545B64" text-anchor="middle">one per tenant, rendered from platform-blueprint</text>
  <rect x="140" y="895" width="100" height="24" rx="12" fill="#8C4FFF"/>
  <text x="190" y="912" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">PRIVATE</text>
  <text x="190" y="945" font-size="14" fill="#545B64" text-anchor="middle">deployments/&lt;stage&gt;.json</text>
  <text x="190" y="965" font-size="14" fill="#545B64" text-anchor="middle">run: stage + version</text>

  <!-- step 1: template -->
  <path d="M265,760 L470,760" stroke="#232F3E" stroke-width="4" fill="none" marker-end="url(#head)"/>
  <circle cx="300" cy="730" r="15" fill="#232F3E"/><text x="300" y="736" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="322" y="736" font-size="15" font-weight="700" fill="#232F3E">create template</text>
  <text x="300" y="790" font-size="13" fill="#545B64">serverlessrepo</text>
  <text x="300" y="808" font-size="13" fill="#545B64">create-cloud-formation-template</text>

  <use href="#tmpl" x="560" y="760"/>
  <text x="560" y="870" font-size="17" font-weight="700" fill="#232F3E" text-anchor="middle">Template URL</text>
  <text x="560" y="892" font-size="14" fill="#545B64" text-anchor="middle">+ the tenant's parameters</text>

  <!-- step 2: change set -->
  <path d="M640,760 L850,760" stroke="#232F3E" stroke-width="4" fill="none" marker-end="url(#head)"/>
  <circle cx="672" cy="730" r="15" fill="#232F3E"/><text x="672" y="736" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="694" y="736" font-size="15" font-weight="700" fill="#232F3E">create change set</text>
  <text x="672" y="790" font-size="13" fill="#545B64">--role-arn (exec role)</text>

  <!-- CloudFormation tile -->
  <rect x="860" y="670" width="180" height="180" rx="6" fill="url(#cfn)"/>
  <g transform="translate(950,760)" fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
    <rect x="-52" y="-30" width="58" height="76" rx="3"/>
    <path d="M-40,-12 h30 M-40,4 h30 M-40,20 h18"/>
    <path d="M10,-6 a22,22 0 0 1 6,-34 a26,26 0 0 1 46,6 a18,18 0 0 1 -6,34 h-28"/>
  </g>
  <text x="950" y="880" font-size="18" font-weight="700" fill="#232F3E" text-anchor="middle">AWS CloudFormation</text>
  <text x="950" y="902" font-size="14" fill="#545B64" text-anchor="middle">change set on the tenant's stack</text>

  <!-- step 3: review gate -->
  <path d="M1040,760 L1150,760" stroke="#232F3E" stroke-width="4" fill="none"/>
  <g transform="translate(1210,760)">
    <path d="M0,-62 L62,0 L0,62 L-62,0 z" fill="#fff" stroke="#232F3E" stroke-width="4"/>
    <text y="-6" font-size="15" font-weight="700" fill="#232F3E" text-anchor="middle">review</text>
    <text y="16" font-size="13" fill="#545B64" text-anchor="middle">change set</text>
  </g>
  <circle cx="1210" cy="672" r="15" fill="#232F3E"/><text x="1210" y="678" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <rect x="1110" y="838" width="200" height="58" rx="8" fill="#fff" stroke="#D5DBDB" stroke-width="2"/>
  <text x="1124" y="862" font-size="14" fill="#1D8102" font-weight="700">✓ Add · Modify</text>
  <text x="1124" y="884" font-size="14" fill="#D13212" font-weight="700">✋ Remove · Replace = stop</text>

  <!-- step 4: execute -->
  <path d="M1272,760 L1380,760" stroke="#232F3E" stroke-width="4" fill="none" marker-end="url(#head)"/>
  <circle cx="1300" cy="730" r="15" fill="#232F3E"/><text x="1300" y="736" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  <text x="1322" y="736" font-size="15" font-weight="700" fill="#232F3E">execute</text>
  <text x="1290" y="790" font-size="13" fill="#545B64">approved</text>

  <!-- tenant account: stack resources -->
  <rect x="1390" y="618" width="350" height="392" rx="12" fill="#fff" stroke="#232F3E" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="1408" y="646" font-size="16" font-weight="700" fill="#232F3E">Tenant AWS account</text>
  <text x="1408" y="666" font-size="13" fill="#545B64">events-observability stack</text>

  <use href="#cube" x="1470" y="730"/>
  <text x="1470" y="802" font-size="13" fill="#232F3E" text-anchor="middle">forwarder Lambda</text>
  <use href="#cube" x="1650" y="730"/>
  <text x="1650" y="802" font-size="13" fill="#232F3E" text-anchor="middle">EventBridge rule</text>
  <use href="#cube" x="1470" y="880"/>
  <text x="1470" y="952" font-size="13" fill="#232F3E" text-anchor="middle">Firehose · SQS</text>
  <use href="#cube" x="1650" y="880"/>
  <text x="1650" y="952" font-size="13" fill="#232F3E" text-anchor="middle">alarms · digest</text>
  <text x="1565" y="990" font-size="13" fill="#545B64" text-anchor="middle">resources and policies · forwards to OpenSearch</text>

  <!-- tenant event bus (owned by platform repo, NOT the stack) -->
  <g transform="translate(1565,582)">
    <rect x="-150" y="-26" width="300" height="52" rx="26" fill="url(#evb)"/>
    <text y="-3" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">tenant event bus</text>
    <text y="15" font-size="12" fill="#fff" text-anchor="middle">owned by the platform repo, not the stack</text>
  </g>
  <path d="M1650,608 L1650,680" stroke="#BC1356" stroke-width="4" fill="none" marker-end="url(#head)"/>
  <text x="1658" y="652" font-size="12" fill="#BC1356">by name</text>

  <!-- to OpenSearch -->
  
  
</svg>
