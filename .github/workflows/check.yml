name: Check

# Every gate that needs no AWS credentials, on every pull request and push:
# each component's `make check`, shellcheck, actionlint, cfn-lint and Terraform.
# Nothing here deploys.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
        with:
          sam: "true"
          terraform: "true"
          lint: "true"
          python-requirements: platform-api/src/requirements.txt
      - id: check
        run: make check
      - name: Summary
        if: always()
        continue-on-error: true
        uses: jnet-platform-factory/.github/actions/job-summary@v0.0.1
        with:
          title: Check
          status: ${{ job.status }}
          rows: |
            Branch: ${{ github.head_ref || github.ref_name }}
            make check: ${{ steps.check.outcome == 'success' && '✅ passed' || steps.check.outcome == 'failure' && '❌ failed' || '⏭️ skipped' }}
